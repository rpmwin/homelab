controllers:
  main:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          # Byparr — FlareSolverr replacement, handles current Cloudflare Turnstile.
          # API-compatible with FlareSolverr (same port 8191, same JSON contract).
          repository: ghcr.io/thephaseless/byparr
          tag: latest
        env:
          LOG_LEVEL: info
          TZ: Asia/Kolkata
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi    # Chromium-based, heavier than FlareSolverr
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 60
              periodSeconds: 30
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 30
              periodSeconds: 15

service:
  main:
    controller: main
    ports:
      http:
        port: 8191

# No ingress — ClusterIP only. Access via:
# http://flaresolverr.media.svc.cluster.local:8191
