defaultPodOptions:
  # Bypass CoreDNS — Airtel UDP/53 is flaky under bursts; Byparr's embedded
  # Firefox makes many parallel DNS queries that overwhelm CoreDNS upstream.
  # Use Cloudflare/Google directly. ndots:1 avoids the search-domain expansion
  # storm (Firefox would otherwise try *.media.svc / *.svc / *.cluster.local
  # for every external host).
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    options:
      - name: ndots
        value: "1"
      - name: timeout
        value: "2"
      - name: attempts
        value: "2"
      - name: single-request-reopen   # serial A then AAAA queries, separate sockets
      - name: no-aaaa                 # skip IPv6 lookups (cluster is IPv4-only)

controllers:
  main:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          # Byparr — FlareSolverr replacement, handles current Cloudflare Turnstile.
          # API-compatible with FlareSolverr (same port 8191, same JSON contract).
          repository: ghcr.io/thephaseless/byparr
          tag: latest
        env:
          LOG_LEVEL: info
          TZ: Asia/Kolkata
          # Bump max challenge time — Cloudflare Turnstile + slow CPU
          # (Sandy Bridge i3-2120) needs more headroom than 60s default.
          # Prowlarr's Indexer Proxy "Request Timeout" must be >= this.
          TIMEOUT: "120000"
        resources:
          requests:
            cpu: 500m      # Chromium solving CF is CPU-bound on weak HW
            memory: 768Mi
          limits:
            cpu: 3000m     # let it burst on cold solve
            memory: 1500Mi
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 60
              periodSeconds: 30
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 30
              periodSeconds: 15

service:
  main:
    controller: main
    ports:
      http:
        port: 8191

# No ingress — ClusterIP only. Access via:
# http://flaresolverr.media.svc.cluster.local:8191
