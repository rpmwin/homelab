controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/hotio/qbittorrent
          tag: release-5.0.4
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Asia/Kolkata
          UMASK: "002"
          WEBUI_PORTS: "8080/tcp,8080/udp"
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        probes:
          # bjw-s v3 default probe targets the first declared port (6881/BT),
          # which only binds when qBit has active torrents. On fresh install
          # it never opens -> kubelet kills the pod every 2 min in a loop.
          # Override with custom HTTP probe on the WebUI port 8080.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 15
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 30

service:
  main:
    controller: main
    ports:
      http:
        port: 8080
  bittorrent:
    controller: main
    type: NodePort
    ports:
      bt-tcp:
        port: 6881
        protocol: TCP
        nodePort: 30881
      bt-udp:
        port: 6881
        protocol: UDP
        nodePort: 30881

ingress:
  main:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - host: qbit.home.iamrpm.xyz
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    type: hostPath
    hostPath: /opt/media/config/qbittorrent
    hostPathType: DirectoryOrCreate
    globalMounts:
      - path: /config
  downloads:
    type: hostPath
    hostPath: /data/downloads
    hostPathType: Directory
    globalMounts:
      - path: /downloads
  incomplete:
    type: hostPath
    hostPath: /opt/media/downloads-incomplete
    hostPathType: DirectoryOrCreate
    globalMounts:
      - path: /downloads/incomplete
