controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Asia/Kolkata
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 6767
              initialDelaySeconds: 30
              periodSeconds: 30

service:
  main:
    controller: main
    ports:
      http:
        port: 6767

ingress:
  main:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - host: bazarr.home.iamrpm.xyz
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - bazarr.home.iamrpm.xyz

persistence:
  config:
    type: hostPath
    hostPath: /opt/media/config/bazarr
    hostPathType: DirectoryOrCreate
    globalMounts:
      - path: /config
  media:
    type: hostPath
    hostPath: /data/media
    hostPathType: Directory
    globalMounts:
      - path: /media
