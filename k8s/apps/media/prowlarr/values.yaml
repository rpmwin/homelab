controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Asia/Kolkata
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9696
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9696
              initialDelaySeconds: 15
              periodSeconds: 15

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

ingress:
  main:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - host: prowlarr.home.iamrpm.xyz
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    type: hostPath
    hostPath: /opt/media/config/prowlarr
    hostPathType: DirectoryOrCreate
    globalMounts:
      - path: /config
