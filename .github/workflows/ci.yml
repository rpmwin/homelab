name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"

jobs:
  backend-1:
    name: Build & Push backend-1
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'apps/backend-1/') ||
      contains(github.event.head_commit.added, 'apps/backend-1/')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend-1
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend-1
          file: ./apps/backend-1/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-1:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-1:${{ github.sha }}

  backend-2:
    name: Build & Push backend-2
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'apps/backend-2/') ||
      contains(github.event.head_commit.added, 'apps/backend-2/')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend-2
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend-2
          file: ./apps/backend-2/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-2:${{ github.sha }}
